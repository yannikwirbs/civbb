name: Feature request
description: Propose new behaviour or a change to existing behaviour.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Reference the design doc section if one applies.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
