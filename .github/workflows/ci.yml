name: ci
# Markdown-only changes skip this; docs.yml checks them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
env:
  CARGO_TERM_COLOR: always
jobs:
  xtask-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain rust-toolchain.toml pins, with its components (ADR 0045).
      - run: rustup toolchain install
      # `cargo xtask ci` runs tests with nextest when installed (ADR 0093), else `cargo test`.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # gilrs (gamepads, ADR 0115) links libudev on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev
      - run: cargo xtask ci
