name: ci
# Markdown-only changes skip this; docs.yml checks them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
env:
  CARGO_TERM_COLOR: always
jobs:
  xtask-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain rust-toolchain.toml pins, with its components (ADR 0045).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci
