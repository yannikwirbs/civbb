[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
# A Unity project, not a crate (ADR 0013).
exclude = ["tools/unity-truth", "tools/unity-exporter", "tools/__pycache__"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every unsafe block states why it is sound (`// SAFETY:` above it); ci denies warnings.
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
civbb-anim = { path = "crates/anim" }
civbb-core = { path = "crates/core" }
civbb-dynamics = { path = "crates/dynamics" }
civbb-format = { path = "crates/format" }
civbb-render = { path = "crates/render" }
civbb-ui = { path = "crates/ui" }
civbb-corpus = { path = "tools/corpus" }
# The client's ECS (design doc §4, ADR 0103); no reflection or async executor until a crate needs them.
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
# The worker pool (ADR 0103); `multi_threaded` gives it threads.
bevy_tasks = { version = "0.20.1", default-features = false, features = ["multi_threaded"] }

# Workspace crates at opt-level 1 in dev builds: the stage tests step and skin avatars on the CPU (full test run 82 s
# at opt-level 0, 19 s at 1), and incremental builds get faster too. Debug assertions and overflow checks stay on.
[profile.dev]
opt-level = 1

# Optimise dependencies in dev builds: crypto, decoding and later the renderer are unusably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
