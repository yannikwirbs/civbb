[package]
name = "civbb-client"
description = "Client: wires the avatar systems into per-avatar islands and frames; a headless benchmark and a desktop viewer in Phase 0."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
basisu = "0.1.0"
civbb-anim.workspace = true
civbb-core.workspace = true
civbb-corpus.workspace = true
civbb-dynamics.workspace = true
civbb-format.workspace = true
civbb-render.workspace = true
flip-rs = { version = "0.1.2", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
winit = "0.30"

[features]
default = ["parity"]
# FLIP scoring (ADR 0033). Off in the fuzz build: flip-rs is also a cdylib, which cargo-fuzz cannot link on MSVC.
parity = ["dep:flip-rs"]

[lints]
workspace = true

[[bin]]
name = "civbb-client"
path = "src/main.rs"
required-features = ["parity"]
