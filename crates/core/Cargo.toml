[package]
name = "civbb-core"
description = "Engine core: math, texture mips, the job runner for per-avatar islands and per-system timing counters."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
civbb-format.workspace = true
bevy_ecs.workspace = true
# Tracy zones per system, island job and render pass (ADR 0103), only with `profile`.
tracy-client = { version = "0.19", optional = true }

[features]
# Tracy zones (ADR 0103); off by default, so release builds hold no Tracy code.
profile = ["dep:tracy-client"]

[lints]
workspace = true
