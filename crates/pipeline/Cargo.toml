[package]
name = "civbb-pipeline"
description = "Content compiler: imports glTF/VRM sources into the format model and builds runtime packages."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
civbb-format.workspace = true
getrandom = "0.2"
gltf = { version = "1.4.1", default-features = false, features = ["names", "extras", "extensions", "KHR_materials_unlit", "KHR_texture_transform"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
civbb-corpus.workspace = true

[[bin]]
name = "civbb"
path = "src/main.rs"
