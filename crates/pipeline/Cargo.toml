[package]
name = "civbb-pipeline"
description = "Content compiler: imports glTF/VRM sources into the format model and builds runtime packages."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
basisu_c_sys = { version = "0.9.1", features = ["encoder", "extra"] }
civbb-anim.workspace = true
civbb-format.workspace = true
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gltf = { version = "1.4.1", default-features = false, features = ["names", "extras", "extensions", "KHR_materials_unlit", "KHR_texture_transform"] }
meshopt = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
basisu = "0.1.0"
civbb-client = { path = "../client" }
civbb-core.workspace = true
civbb-corpus.workspace = true

[[bin]]
name = "civbb"
path = "src/main.rs"
